<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAA 接口设计文档</title>
<style>
  :root{
    --red:#b81c18;
    --orange:#e0630a;
    --ink:#241b17;
    --muted:#6b5b54;
    --rule:#e9dad2;
    --paper:#fffdfb;
    --code-bg:#fbf3ee;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:84px;}
  body{
    margin:0;
    background:#f7efe9;
    color:var(--ink);
    font:15px/1.75 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:16px;
    padding:10px 28px;
    background:linear-gradient(180deg,#fff 0%,#fffaf6 100%);
    border-bottom:1px solid var(--rule);
    box-shadow:0 2px 10px rgba(120,60,30,.06);
  }
  .brand-logo{width:133px;height:40px;object-fit:contain;flex:none;}
  .titles{flex:1;min-width:0;}
  .doc-title{font-size:17px;font-weight:700;color:var(--red);letter-spacing:.5px;}
  .doc-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .actions{display:flex;gap:10px;flex:none;align-items:center;}
  .picker{
    font:inherit;font-size:13px;padding:7px 10px;max-width:200px;
    border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);
    cursor:pointer;
  }
  .picker:hover{border-color:var(--orange);color:var(--orange);}
  .picker:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(224,99,10,.12);}
  .btn{
    font:inherit;font-size:13px;padding:7px 16px;border-radius:6px;cursor:pointer;
    border:1px solid var(--rule);background:#fff;color:var(--ink);transition:.15s;
  }
  .btn:hover{border-color:var(--orange);color:var(--orange);}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.primary:hover{background:#9d1714;border-color:#9d1714;color:#fff;}
  .btn:disabled{opacity:.55;cursor:progress;}
  .banner{
    margin:18px auto 0;max-width:1020px;padding:12px 18px;border-radius:8px;
    border-left:4px solid var(--orange);background:#fff;font-size:13.5px;
    box-shadow:0 1px 6px rgba(120,60,30,.07);
  }
  .banner.ok{border-left-color:#2f6b4f;}
  .banner.err{border-left-color:var(--red);color:#7d1310;}
  .banner .kv{color:var(--muted);font-size:12.5px;}
  main{
    max-width:1020px;margin:22px auto 80px;padding:36px 48px;
    background:var(--paper);border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 4px 24px rgba(120,60,30,.06);
  }
  h1,h2,h3,h4,h5,h6{color:var(--red);line-height:1.4;margin:1.6em 0 .6em;font-weight:700;}
  h1{font-size:28px;text-align:center;margin-top:.2em;padding-bottom:.5em;border-bottom:3px solid var(--orange);}
  h2{font-size:21px;border-left:5px solid var(--orange);padding-left:12px;}
  h3{font-size:17.5px;color:#9d4a12;}
  h4{font-size:15.5px;color:#6b3a1a;}
  h5,h6{font-size:14.5px;color:#6b3a1a;}
  p{margin:.7em 0;}
  a{color:var(--orange);text-decoration:none;border-bottom:1px solid rgba(224,99,10,.35);}
  a:hover{color:var(--red);border-bottom-color:var(--red);}
  ul,ol{margin:.6em 0;padding-left:1.7em;}
  li{margin:.28em 0;}
  li>ul,li>ol{margin:.2em 0;}
  strong{color:#7a2410;}
  hr{border:0;border-top:1px dashed var(--rule);margin:2em 0;}
  blockquote{
    margin:1em 0;padding:10px 16px;background:#fdf3ec;
    border-left:4px solid var(--orange);border-radius:0 6px 6px 0;color:#5a4336;
  }
  blockquote p{margin:0;}
  code{
    font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-size:.88em;background:var(--code-bg);color:#8a2f0c;
    padding:.12em .38em;border-radius:4px;border:1px solid #f0ded2;
  }
  pre.code{
    position:relative;margin:1em 0;padding:14px 16px;overflow:auto;
    background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;
    font-size:13px;line-height:1.6;
  }
  pre.code code{background:none;border:0;padding:0;color:#3d2b22;font-size:1em;}
  pre.code::before{
    content:attr(data-lang);position:absolute;top:6px;right:10px;
    font-size:11px;letter-spacing:.5px;color:#b58a6e;text-transform:uppercase;
  }
  .table-wrap{overflow-x:auto;margin:1em 0;}
  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  th,td{border:1px solid var(--rule);padding:7px 11px;text-align:left;vertical-align:top;}
  th{background:#fbeadf;color:#8a2f0c;font-weight:600;white-space:nowrap;}
  tbody tr:nth-child(even){background:#fdf8f4;}
  td>code,th>code{white-space:nowrap;}
  .placeholder{color:var(--muted);text-align:center;padding:60px 0;}
  .placeholder .kv{display:block;color:#9b7f70;font-size:12.5px;word-break:break-all;}
  /* editor */
  #editor{max-width:1400px;margin:18px auto 40px;padding:0 24px;}
  .editor-bar{display:flex;align-items:center;gap:10px;padding:6px 0 12px;}
  .editor-bar .state{font-size:12.5px;color:var(--muted);}
  .editor-bar .state.dirty{color:var(--orange);font-weight:600;}
  .editor-bar .state.saved{color:#2f6b4f;font-weight:600;}
  .editor-bar .grow{flex:1;}
  .editor-body{display:flex;gap:14px;height:calc(100vh - 168px);min-height:420px;}
  #textarea{
    flex:1 1 50%;min-width:0;resize:none;tab-size:2;
    font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-size:13px;line-height:1.65;padding:14px 16px;color:#2a1e18;background:#fff;
    border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 2px 12px rgba(120,60,30,.05);
  }
  #textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(224,99,10,.12);}
  .editor-preview{
    flex:1 1 50%;min-width:0;overflow:auto;padding:22px 26px;
    background:var(--paper);border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 2px 12px rgba(120,60,30,.05);
  }
  .editor-preview h1{font-size:22px;}
  .editor-preview h2{font-size:18px;}
  @media (max-width:900px){
    .editor-body{flex-direction:column;height:auto;}
    #textarea{height:50vh;}
    .editor-preview{height:50vh;padding:16px;}
  }
  .placeholder code{white-space:nowrap;}
  @media (max-width:760px){
    .topbar{flex-wrap:wrap;padding:10px 16px;}
    .actions{width:100%;justify-content:flex-end;}
    main{padding:22px 18px;margin:14px 10px 60px;}
  }
</style>
</head>

<script>
/* ---------------------------------------------------------------- markdown */

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* GitHub-style heading anchor, so the document's own table of contents works.
   Each space becomes one hyphen (no collapsing), which is what the anchors that
   the document already carries expect: "TAA → 平台" -> "taa--平台". */
function slug(text) {
  return text.toLowerCase()
    .replace(/[^\p{L}\p{N}\s-]/gu, '')
    .trim()
    .replace(/\s/g, '-');
}

/* Join hard-wrapped source lines: no space between CJK, one space otherwise. */
function joinLines(lines) {
  let out = '';
  for (const raw of lines) {
    const line = raw.trim();
    if (!out) { out = line; continue; }
    const cjk = /[一-鿿　-〿＀-￯]$/.test(out) &&
                /^[一-鿿　-〿＀-￯]/.test(line);
    out += (cjk ? '' : ' ') + line;
  }
  return out;
}

function inline(text) {
  const codes = [];
  let s = text.replace(/`([^`]+)`/g, (m, c) => {
    codes.push(esc(c));
    return '\u0000C' + (codes.length - 1) + '\u0000';
  });
  s = esc(s);
  s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, href) =>
    '<a href="' + href.replace(/"/g, '&quot;') + '">' + t + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0000C(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
  return s;
}

function renderTable(head, rows) {
  const cells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '')
    .split('|').map(c => c.trim());
  const header = cells(head);
  let html = '<div class="table-wrap"><table><thead><tr>' +
    header.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
  for (const row of rows) {
    const cs = cells(row).slice(0, header.length);
    while (cs.length < header.length) cs.push('');
    html += '<tr>' + cs.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
  }
  return html + '</tbody></table></div>';
}

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const BLOCK_START = /^(#{1,6}\s|```|\s*\||\s*>|\s*([-*+]|\d+[.)])\s)/;
const TABLE_SEP = /^\s*\|[\s:|-]+\|?\s*$/;
const isTableStart = (ls, k) => /^\s*\|/.test(ls[k]) && k + 1 < ls.length && TABLE_SEP.test(ls[k + 1]);

/* A blockquote may carry a table (used for the FHE callback parameters), so
   table runs are rendered as tables and the rest as line-broken text. */
function renderQuote(lines) {
  const parts = [];
  let k = 0;
  while (k < lines.length) {
    if (isTableStart(lines, k)) {
      const head = lines[k], rows = [];
      k += 2;
      while (k < lines.length && /^\s*\|/.test(lines[k])) rows.push(lines[k++]);
      parts.push(renderTable(head, rows));
      continue;
    }
    const group = [];
    while (k < lines.length && !isTableStart(lines, k)) group.push(lines[k++]);
    if (!group.length) group.push(lines[k++]);
    parts.push(group.map(t => t.trim() ? inline(t) : '').join('<br>'));
  }
  return parts.join('');
}

function renderList(items) {
  let idx = 0;
  function build(level) {
    const tag = items[idx].ordered ? 'ol' : 'ul';
    let html = '<' + tag + '>';
    while (idx < items.length && items[idx].indent >= level) {
      const item = items[idx++];
      let nested = '';
      if (idx < items.length && items[idx].indent > item.indent) {
        nested = build(items[idx].indent);
      }
      html += '<li>' + inline(joinLines(item.text)) + nested + '</li>';
    }
    return html + '</' + tag + '>';
  }
  let html = '';
  while (idx < items.length) html += build(items[idx].indent);
  return html;
}

function renderMarkdown(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    let m = /^```(\w*)\s*$/.exec(line);
    if (m) {
      const lang = m[1], buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : '') +
        '><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }

    m = /^(#{1,6})\s+(.*?)\s*$/.exec(line);
    if (m) {
      const lv = m[1].length, text = m[2];
      out.push('<h' + lv + ' id="' + slug(text) + '">' + inline(text) + '</h' + lv + '>');
      i++;
      continue;
    }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

    if (isTableStart(lines, i)) {
      const head = line, rows = [];
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push(renderTable(head, rows));
      continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      }
      out.push('<blockquote>' + renderQuote(buf) + '</blockquote>');
      continue;
    }

    if (LIST_ITEM.test(line)) {
      const items = [];
      while (i < lines.length) {
        const cur = lines[i];
        const mm = LIST_ITEM.exec(cur);
        if (mm) {
          items.push({
            indent: mm[1].replace(/\t/g, '  ').length,
            ordered: /\d/.test(mm[2]),
            text: [mm[3]],
          });
          i++;
        } else if (cur.trim() && /^\s{2,}\S/.test(cur) && items.length && !BLOCK_START.test(cur)) {
          items[items.length - 1].text.push(cur);
          i++;
        } else {
          break;
        }
      }
      out.push(renderList(items));
      continue;
    }

    const buf = [];
    while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i]) &&
           !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
      buf.push(lines[i++]);
    }
    /* Never leave the cursor in place: a block starter that no branch claimed
       would otherwise spin here forever. */
    if (!buf.length) buf.push(lines[i++]);
    out.push('<p>' + inline(joinLines(buf)) + '</p>');
  }
  return out.join('\n');
}

/* ------------------------------------------------------------------- page */

const $ = id => document.getElementById(id);
const banner = $('banner');

/* Text of api-design.md as it was last loaded or saved; the editor compares
   against it to know whether there are unsaved changes. */
let currentMd = '';

function showBanner(kind, html) {
  banner.hidden = false;
  banner.className = 'banner ' + kind;
  banner.innerHTML = html;
}

function fileHint(detail) {
  return '<div class="placeholder">' +
    '读取 <code>api-design.md</code> 失败。<br><br>' +
    '本页需要通过本地服务打开（浏览器不允许 <code>file://</code> 页面读取本地文件）。<br><br>' +
    '在仓库根目录运行：<br><br>' +
    '<code>python3 tools/showdoc-sync/serve.py</code><br><br>' +
    '然后打开 <code>http://127.0.0.1:8770/</code>。<br><br>' +
    '<span class="kv">当前地址：' + esc(location.href) + '</span><br>' +
    '<span class="kv">错误：' + esc(detail || '未知') + '</span></div>';
}

/* A fetch that never settles would leave the page on "loading" forever, so
   every request carries a deadline and the failure names the URL it tried. */
async function fetchText(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error(url + ' 返回 HTTP ' + res.status);
    return await res.text();
  } catch (err) {
    if (err.name === 'AbortError') throw new Error(url + ' 请求超时（' + ms + 'ms 无响应）');
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/* ------------------------------------------------------------- file switch */

const SYNCED_FILE = 'api-design.md';   // the only file with a ShowDoc page
let currentFile = SYNCED_FILE;

function mdTitle(md) {
  const m = /^#\s+(.+)$/m.exec(md);
  return m ? m[1].trim() : currentFile;
}

function stamp() {
  return new Date().toLocaleString('zh-CN', { hour12: false });
}

/* Paint the reading view and keep the header in step with the file on screen. */
function paintMain(md, note) {
  currentMd = md;
  $('content').innerHTML = renderMarkdown(md);
  const title = mdTitle(md);
  $('doc-title').textContent = title;
  document.title = title;
  $('meta').textContent = md.length.toLocaleString() + ' 字符 · ' + currentFile +
    ' · ' + (note || '加载于 ' + stamp());
  updateSyncButtons();
}

/* Only api-design.md has a ShowDoc counterpart, so the sync actions are tied
   to it rather than to whatever file happens to be open. */
function updateSyncButtons() {
  const synced = currentFile === SYNCED_FILE;
  for (const id of ['btn-status', 'btn-sync']) {
    const btn = $(id);
    btn.disabled = !synced;
    btn.title = synced ? '' : '只有 ' + SYNCED_FILE + ' 对应 ShowDoc 页面';
  }
}

function fillFileSelect(files) {
  const sel = $('file-select');
  sel.innerHTML = '';
  for (const f of files) {
    const opt = document.createElement('option');
    opt.value = f.name;
    opt.textContent = f.name;
    opt.title = f.title;
    sel.appendChild(opt);
  }
  sel.value = currentFile;
}

async function loadDoc(name) {
  try {
    if (location.protocol === 'file:') throw new Error('file:// 页面无法读取本地文件');
    const md = await fetchText('/doc?name=' + encodeURIComponent(name), 10000);
    currentFile = name;
    $('file-select').value = name;
    paintMain(md);
    /* The content is built after load, so a deep link needs an explicit jump. */
    if (location.hash) {
      const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    }
  } catch (err) {
    showLoadError(err.message);
  }
}

/* The header line is the first thing a reader reads, so no failure path may
   leave it on "loading": both the early return below and loadDoc's catch
   have to repaint it. */
function showLoadError(detail) {
  $('content').innerHTML = fileHint(detail);
  $('meta').textContent = '加载失败：' + detail;
}

async function boot() {
  if (location.protocol === 'file:') {
    showLoadError('file:// 页面无法读取本地文件');
    return;
  }
  try {
    const list = await callApi('/api/docs');
    fillFileSelect(list.files || []);
    if (list.default && list.files.some(f => f.name === list.default)) {
      currentFile = list.default;
    }
  } catch (err) {
    showBanner('err', '<strong>读取文件列表失败：</strong>' + esc(err.message));
  }
  await loadDoc(currentFile);
}

async function callApi(path, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try {
    res = await fetch(path, { method: body === undefined ? 'GET' : 'POST', body, signal: ctrl.signal });
  } catch (err) {
    throw new Error(err.name === 'AbortError' ? path + ' 请求超时' : path + ' 请求失败：' + err.message);
  } finally {
    clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('接口返回的不是 JSON（HTTP ' + res.status + '）'); }
  if (!data.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

$('btn-status').onclick = async () => {
  const btn = $('btn-status');
  btn.disabled = true;
  btn.textContent = '检查中…';
  try {
    const d = await callApi('/api/status');
    const same = d.same;
    showBanner(same ? 'ok' : '', same
      ? '<strong>线上与本地一致。</strong><div class="kv">page ' + d.page_id + '「' + d.title + '」· ' +
        d.local_chars.toLocaleString() + ' 字符 · sha1 ' + d.local_sha1.slice(0, 12) + '</div>'
      : '<strong>线上与本地不一致。</strong><div class="kv">本地 ' + d.local_chars.toLocaleString() +
        ' 字符 sha1 ' + d.local_sha1.slice(0, 12) + ' · 线上 ' + d.online_chars.toLocaleString() +
        ' 字符 sha1 ' + d.online_sha1.slice(0, 12) + '。可点击「同步到 ShowDoc」更新。</div>');
  } catch (err) {
    showBanner('err', '<strong>检查失败：</strong>' + esc(err.message) +
      '<div class="kv">确认已通过 <code>python3 tools/showdoc-sync/serve.py</code> 打开本页，并且 ShowDoc 可达。</div>');
  } finally {
    btn.disabled = false;
    btn.textContent = '检查线上版本';
  }
};

$('btn-sync').onclick = async () => {
  const btn = $('btn-sync');
  if (!confirm('用本地 docs/api-design.md 覆盖 ShowDoc 页面 ' + TARGET + '？\n线上旧版会先备份到 .claude/backup/。')) return;
  btn.disabled = true;
  btn.textContent = '同步中…';
  try {
    const d = await callApi('/api/sync', '');
    const lines = [
      '<strong>' + (d.changed ? '同步完成。' : '未写入。') + '</strong> ' + esc(d.message || ''),
      '<div class="kv">page ' + d.page_id + '「' + esc(d.title) + '」· 本地 ' +
        d.local_chars.toLocaleString() + ' 字符 sha1 ' + d.local_sha1.slice(0, 12) + '</div>',
    ];
    if (d.changed) {
      lines.push('<div class="kv">线上更新前 ' + d.online_chars_before.toLocaleString() + ' 字符 → 更新后 ' +
        (d.online_chars_after || 0).toLocaleString() + ' 字符 · 回读 sha1 ' +
        (d.online_sha1_after || '').slice(0, 12) + ' · ' + esc(d.saved_at) + '</div>');
      if (d.backup) lines.push('<div class="kv">旧版备份：' + esc(d.backup) + '</div>');
    }
    showBanner('ok', lines.join(''));
  } catch (err) {
    showBanner('err', '<strong>同步失败：</strong>' + esc(err.message));
  } finally {
    btn.disabled = false;
    btn.textContent = '同步到 ShowDoc';
  }
};

/* ------------------------------------------------------------------ editor */

const textarea = $('textarea');
const previewEl = $('preview');
const editState = $('edit-state');
let dirty = false;
let previewTimer = null;

function refreshState(savedText) {
  dirty = textarea.value !== currentMd;
  editState.className = 'state' + (dirty ? ' dirty' : '');
  editState.textContent = currentFile + ' · ' + textarea.value.length.toLocaleString() + ' 字符' +
    (dirty ? ' · 未保存' : (savedText ? ' · 已保存' : ''));
}

function paintPreview() {
  const top = previewEl.scrollTop;
  previewEl.innerHTML = renderMarkdown(textarea.value);
  previewEl.scrollTop = top;
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(paintPreview, 250);
}

function enterEdit() {
  if (!currentMd) {
    showBanner('err', '<strong>文档尚未加载，无法编辑。</strong>' +
      '<div class="kv">请通过 <code>python3 tools/showdoc-sync/serve.py</code> 打开本页。</div>');
    return;
  }
  textarea.value = currentMd;
  refreshState();
  previewEl.innerHTML = renderMarkdown(currentMd);
  $('content').hidden = true;
  $('editor').hidden = false;
  $('btn-edit').textContent = '返回预览';
  textarea.focus();
  textarea.setSelectionRange(0, 0);
  textarea.scrollTop = 0;
}

function exitEdit() {
  if (dirty && !confirm('有未保存的修改，退出后会丢失。确定退出？')) return;
  $('editor').hidden = true;
  $('content').hidden = false;
  $('btn-edit').textContent = '编辑';
  if (!dirty) return;
  /* Re-render from the text on disk, not from the discarded edits. */
  renderMainFromDisk();
}

async function renderMainFromDisk() {
  try {
    const md = await fetchText('/doc?name=' + encodeURIComponent(currentFile), 10000);
    paintMain(md);
  } catch (err) {
    $('content').innerHTML = fileHint(err.message);
  }
}

async function saveDoc() {
  if ($('editor').hidden) return;
  const btn = $('btn-save');
  const text = textarea.value;
  if (!text.trim()) {
    showBanner('err', '<strong>未保存：</strong>文档内容为空。');
    return;
  }
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    const d = await callApi('/api/save', new URLSearchParams({ name: currentFile, content: text }));
    currentMd = text;
    refreshState(true);
    paintMain(currentMd, '保存于 ' + stamp());
    showBanner('ok', '<strong>已写入 docs/' + esc(currentFile) + '</strong>' +
      '<div class="kv">' + d.chars.toLocaleString() + ' 字符 · sha1 ' + d.sha1.slice(0, 12) +
      (d.backup ? ' · 旧版备份 ' + esc(d.backup) : '') +
      (currentFile === SYNCED_FILE ? ' · 尚未同步到 ShowDoc，需要时点「同步到 ShowDoc」'
                                   : ' · 该文件没有对应的 ShowDoc 页面') + '</div>');
  } catch (err) {
    showBanner('err', '<strong>保存失败：</strong>' + esc(err.message));
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}

$('btn-edit').onclick = () => { $('editor').hidden ? enterEdit() : exitEdit(); };
$('btn-save').onclick = saveDoc;
$('btn-exit').onclick = exitEdit;
$('btn-revert').onclick = () => {
  if (dirty && !confirm('放弃未保存的修改，还原到上次保存的内容？')) return;
  textarea.value = currentMd;
  refreshState();
  paintPreview();
};
textarea.addEventListener('input', () => { refreshState(); schedulePreview(); });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (!$('editor').hidden) saveDoc();
  }
});
window.addEventListener('beforeunload', (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

$('file-select').onchange = async (e) => {
  const next = e.target.value;
  if (next === currentFile) return;
  if (dirty && !confirm('有未保存的修改，切换文件会丢失。确定切换？')) {
    e.target.value = currentFile;
    return;
  }
  if (!$('editor').hidden) {
    $('editor').hidden = true;
    $('content').hidden = false;
    $('btn-edit').textContent = '编辑';
    dirty = false;
  }
  history.replaceState(null, '', location.pathname);
  window.scrollTo({ top: 0 });
  await loadDoc(next);
};

let TARGET = 'ShowDoc';
fetch('/api/config').then(r => r.json()).then(d => {
  if (d && !d.error) TARGET = d.page_id + (d.title ? '「' + d.title + '」' : '');
}).catch(() => {});

boot();
</script>
</body>
</html>
