[package]
name = "teecrypto-gui"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.8"
pem = "3"
aes-gcm = "0.10"
sm4 = "0.5"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 2
strip = true
