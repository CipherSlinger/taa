openapi: 3.0.3
info:
  title: TAA (Trusted Application Agent) API 接口协议
  version: 1.0.0
  description: |
    TAA（Trusted Application Agent）是运行在 Hygon CSV TEE 可信执行环境中的密态计算执行框架与代理守护进程。
    本规范定义了平台与 TAA 之间的所有双向交互协议：
    - 平台向 TAA 下发的控制指令（健康检查、状态查询、资源导入、阶段切换、结果导出等）
    - TAA 向平台主动发起的上报与回调（启动注册、证明报告上报、训练结果与代码审计报告回传等）
servers:
  - url: http://127.0.0.1:6001
    description: TAA 实例监听端点（默认端口 6001）
  - url: http://127.0.0.1:18080
    description: 管控平台或 Platform-Mock 接收端点

paths:
  # =========================================================================
  # 平台 → TAA 控制接口
  # =========================================================================

  /v1/taa/health:
    post:
      summary: 健康检查
      description: 平台检查 TAA 服务的连通性与存活状态。
      tags:
        - 运维与监控
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  status: "ok"
                error: 0

  /v1/taa/status:
    post:
      summary: 状态查询
      description: 查询 TAA 运行状态、当前阶段、资源导入就绪情况以及当前执行的操作。
      tags:
        - 运维与监控
      responses:
        '200':
          description: 成功返回状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      result:
                        $ref: '#/components/schemas/StatusResult'
              example:
                msg: "success"
                result:
                  currentPhase: 1
                  modelImported: true
                  dataImported: false
                  trainingDataImported: false
                  trainingDone: false
                  currentOp: "idle"
                error: 0

  /v1/taa/getAttestation:
    post:
      summary: 获取远程证明报告
      description: 平台主动向 TAA 请求获取最新的 Hygon CSV 远程证明报告（包含 USERDATA 绑定的公钥）。
      tags:
        - 远程证明
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAttestationRequest'
            example:
              requestId: "req-att-001"
      responses:
        '200':
          description: 成功获取远程证明报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      result:
                        $ref: '#/components/schemas/GetAttestationResult'
              example:
                msg: "success"
                result:
                  requestId: "req-att-001"
                  verifiedPass: true
                  attestation: "base64-encoded-attestation-report..."
                  attestationValues: '{"userdata":"-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----","mnonce":"0123...","digest":"0123...","chipId":"0123..."}'
                error: 0

  /v1/taa/import:
    post:
      summary: 导入数据资源
      description: >-
        平台向 TAA 下发测试数据（phase 2）或正式训练数据（phase 3）的密态资源包，TAA 同步接收后异步解密、校验并入库。
        本接口是触发训练的唯一入口：数据入库后，若模型已导入且当前无在飞训练，立即执行 runtimeConfig 中的命令，
        训练结果通过 /v1/taa/reportRes 上报。请求中的历史字段 type 被完全忽略。
        密态资源支持两种形态（本接口与 /v1/taa/importModel 均解析该参数；/v1/taa/getResourceInfo 不解析该参数）：
        resourceUrl 形如 <下载链接>?dataKeyCipher=<hex C1C3C2> 时，
        下载链接只含 SM4-GCM 密文，密钥信封由该参数给出，TAA 在下载前解析并解封，参数非法即返回 400 且不发起下载；
        参数前的分隔符 ? 与 & 均可（下载链接自带 query 时平台常用 ? 拼接），剥离后其余 query 逐字节保留；
        未携带该参数时沿用原逻辑：整文件信封（WrappedKey || Ciphertext）、.enc 后缀强制解密、明文压缩包按魔数直通。
      tags:
        - 资源流转
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
            example:
              resourceUrl: "http://platform.internal/files/encrypted-data.tar.gz.enc"
              taskId: "task-20260902-001"
              requestId: "req-imp-001"
              runtimeConfig: '{"commands":["python3 train.py --epochs 10"]}'
      responses:
        '200':
          description: >-
            请求已受理，result 恒为 null。资源下载在响应返回前同步完成（下载失败返回 500）；
            此后的解密、解压与训练结果均通过 /v1/taa/reportRes 异步回传。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "数据已接收，训练结果将通过 reportRes 上报"
                result: null
                error: 0
        '400':
          description: 参数错误（resourceUrl 为空；requestId/taskId 同时为空；requestId 或 taskId 已存在或正在处理中；dataKeyCipher 重复、为空、hex 非法、长度非法或信封解不开）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "resourceUrl 不能为空"
                result: null
                error: 400
        '409':
          description: 并发冲突（已有训练任务或其他任务正在执行中）。模型代码审计与训练解耦，审计进行中不阻止数据下发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "当前已有训练任务正在执行中 (taskId: task-001, op: training)，请等待完成后再提交"
                result: null
                error: 409
        '500':
          description: 下载资源失败或加载导入索引失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "下载资源失败: HTTP 404"
                result: null
                error: 500

  /v1/taa/importModel:
    post:
      summary: 导入模型代码
      description: >-
        平台向 TAA 下发模型代码密态资源包（Phase 1）。TAA 同步接收请求并异步完成解封、解压，
        随后在 TEE 内执行静态代码扫描及 LLM 语义安全审计。审计在后台异步进行，其结论通过
        /v1/taa/reportAudit 单独回传，仅供参考：本接口不等待审计结论，也不由审计结论触发或阻止训练。
        本接口不触发训练，训练由后续数据下发 /v1/taa/import 拉起。
        密态资源支持两种形态（本接口与 /v1/taa/import 均解析该参数；/v1/taa/getResourceInfo 不解析该参数）：
        resourceUrl 形如 <下载链接>?dataKeyCipher=<hex C1C3C2> 时，
        下载链接只含 SM4-GCM 密文，密钥信封由该参数给出，TAA 在下载前解析并解封，参数非法即返回 400 且不发起下载；
        参数前的分隔符 ? 与 & 均可（下载链接自带 query 时平台常用 ? 拼接），剥离后其余 query 逐字节保留；
        未携带该参数时沿用原逻辑：整文件信封（WrappedKey || Ciphertext）、.enc 后缀强制解密、明文压缩包按魔数直通。
      tags:
        - 资源流转
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportModelRequest'
            example:
              resourceUrl: "http://platform.internal/files/model-package.tar.gz.enc"
              taskId: "task-20260902-001"
              requestId: "req-model-001"
              runtimeConfig: '{"commands":["python3 train.py --epochs 10"]}'
      responses:
        '200':
          description: >-
            请求已受理。result 恒为 null。资源下载在响应返回前同步完成（下载失败返回 500）；
            模型导入结果通过 /v1/taa/reportModelImport 异步回传，代码审计结论通过
            /v1/taa/reportAudit 异步回传。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                resourceAccepted:
                  summary: resourceUrl 非空，资源已下载完成，解密、解压与审计随后异步执行
                  value:
                    msg: "模型已接收，训练结果将通过 reportRes 上报"
                    result: null
                    error: 0
                configOnly:
                  summary: resourceUrl 为空，仅更新模型运行配置，等待数据再次下发
                  value:
                    msg: "模型参数命令已导入，等待数据重新导入后执行训练"
                    result: null
                    error: 0
        '400':
          description: 参数错误（requestId/taskId 同时为空；resourceUrl 为空且此前未导入过模型；publicKey 解析失败；resourceUrl 为空时 runtimeConfig 为空、解析失败或 commands 为空；dataKeyCipher 重复、为空、hex 非法、长度非法或信封解不开）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "resourceUrl 不能为空: 之前未传输过且请求中为空"
                result: null
                error: 400
        '409':
          description: 并发冲突（已有训练任务或任务正在执行中；已有模型代码审计正在执行中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "当前已有训练任务正在执行中 (taskId: task-001, op: training)，请等待完成后再提交"
                result: null
                error: 409
        '500':
          description: 资源下载失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "下载资源失败: HTTP 404"
                result: null
                error: 500

  /v1/taa/getResourceInfo:
    post:
      summary: 获取资源预分析与目录树信息
      description: 平台传入 resourceUrl，TAA 下载并解密资源，按魔数识别多模态数据结构并输出带注释的目录树 JSON。
      tags:
        - 资源流转
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetResourceInfoRequest'
            example:
              resourceUrl: "http://platform.internal/files/dataset.zip"
      responses:
        '200':
          description: 成功解析资源结构
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      result:
                        $ref: '#/components/schemas/ResourceInfoResult'
              example:
                msg: "success"
                result:
                  name: "dataset.zip"
                  size: 10485760
                  fileCount: 15
                  fileTree:
                    type: "directory"
                    name: "root"
                    children: []
                error: 0

  /v1/taa/switch:
    post:
      summary: 切换运行阶段
      description: 平台通知 TAA 切换计算阶段（1=调试, 2=测试, 3=正式训练, 4=推理），并拉起对应沙箱执行脚本。
      tags:
        - 任务执行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchRequest'
            example:
              phase: 2
      responses:
        '200':
          description: 阶段切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "阶段切换成功"
                result:
                  phase: 2
                  phaseName: "测试"
                error: 0

  /v1/taa/export:
    post:
      summary: 导出结果
      description: >-
        平台请求 TAA 打包导出当前阶段的结果。publicKey 整体非必填：phase 1/2 取请求中的 publicKey，
        phase 3 依次取 phase 1 /v1/taa/importModel 保存的公钥、请求中的 publicKey；取到公钥则以 SM2
        信封加密后返回文件流，取不到则以明文流返回。
      tags:
        - 任务执行
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            example:
              taskId: "task-20260902-001"
              publicKey: "-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"
      responses:
        '200':
          description: 导出结果二进制流（或自包含信封密文）
          headers:
            Content-Disposition:
              schema:
                type: string
              example: "attachment; filename=\"result-task-001.bin\""
            X-TAA-Task-Id:
              schema:
                type: string
              example: "task-20260902-001"
            X-TAA-Encrypted:
              schema:
                type: string
              example: "true"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 参数错误或未通过结果泄露检查
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # =========================================================================
  # TAA → 平台 回调与上报接口
  # =========================================================================

  /v1/taa/register:
    post:
      summary: TAA 启动注册
      description: TAA 启动后主动向平台发送自身绑定的 SM2 公钥、Hygon CSV 远程证明报告以及运行元数据。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 平台成功确认注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                  verifiedPass: true
                error: 0

  /v1/taa/reportRes:
    post:
      summary: 上报训练完成结果
      description: 训练或推理执行完成后，TAA 向平台回传包含数据集摘要、模型哈希、训练指标和审计摘要的报告。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportResRequest'
      responses:
        '200':
          description: 平台成功接收训练结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                error: 0

  /v1/taa/reportModelImport:
    post:
      summary: 上报模型导入与完整性校验结果
      description: TAA 完成模型解包、解密与完整性校验（SM3 checksum）后，向平台回传模型导入状态与完整性信息。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportModelImportRequest'
      responses:
        '200':
          description: 平台成功接收模型导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                error: 0

  /v1/taa/reportAudit:
    post:
      summary: 上报模型代码安全审计结果
      description: >-
        TAA 完成模型代码静态规则扫描与 LLM 语义审查后，向平台回传代码审计结论与明细报告。
        审计在后台异步执行，本结论仅供参考：它不触发也不阻止训练，平台如需按结论处置该模型需自行判断。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportAuditRequest'
      responses:
        '200':
          description: 平台成功接收代码安全审计结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                error: 0

  /v1/taa/modelLog:
    post:
      summary: 上报任务终端日志
      description: TAA 在任务执行过程中向平台批量上报模型终端日志。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelLogRequest'
      responses:
        '200':
          description: 平台成功接收日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                error: 0

  /v1/taa/taaLog:
    post:
      summary: 上报 TAA 运行日志
      description: TAA 在运行过程中向平台批量主动上报 TAA 自身的内部运行日志。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaaLogRequest'
      responses:
        '200':
          description: 平台成功接收日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                error: 0

  /v1/taa/reportProgress:
    post:
      summary: 上报任务进度
      description: TAA 在任务执行过程中向平台主动上报当前任务的数值进度百分比。
      tags:
        - 平台回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportProgressRequest'
      responses:
        '200':
          description: 平台成功接收进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: "success"
                result:
                  received: true
                error: 0

components:
  schemas:
    # ── 公共响应包装 ────────────────────────────────────────────────────────
    ApiResponse:
      type: object
      required:
        - msg
        - error
      properties:
        msg:
          type: string
          description: 返回消息说明
          example: "success"
        result:
          type: object
          nullable: true
          description: 具体的业务数据对象；无数据时为 null
        error:
          type: integer
          description: 错误码，0 表示成功，非 0 表示各类业务或系统错误
          example: 0

    # ── 状态模型 ────────────────────────────────────────────────────────────
    StatusResult:
      type: object
      properties:
        currentPhase:
          type: integer
          description: 当前阶段 (1=调试, 2=测试, 3=训练, 4=推理)
          example: 1
        modelImported:
          type: boolean
          description: 模型代码是否已导入
        dataImported:
          type: boolean
          description: 测试数据是否已导入
        trainingDataImported:
          type: boolean
          description: 训练数据是否已导入
        trainingDone:
          type: boolean
          description: 训练是否已完成
        currentOp:
          type: string
          description: 当前后台操作 (idle/downloading/decrypting/extracting/training/auditing 等)
          example: "idle"

    # ── 证明模型 ────────────────────────────────────────────────────────────
    GetAttestationRequest:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: 防重放请求唯一标识符
          example: "req-att-001"

    GetAttestationResult:
      type: object
      properties:
        requestId:
          type: string
        verifiedPass:
          type: boolean
          description: TAA 本地对 CSV 报告的验证结果
        attestation:
          type: string
          description: Base64 编码的 Hygon CSV 二进制远程证明报告 (长度 0x9F4 字节)
        attestationValues:
          type: string
          description: 报告关键字段提取后的 JSON 序列化字符串 (含 userdata, mnonce, digest, chipId 等)

    # ── 资源导入模型 ────────────────────────────────────────────────────────
    ImportRequest:
      type: object
      required:
        - resourceUrl
      properties:
        resourceUrl:
          type: string
          description: 加密数据资源的 HTTP(S) 下载地址。密态资源可携带 ?dataKeyCipher=<hex> 参数承载 SM2 数据密钥信封（C1C3C2 布局，112 或 113 字节），该参数不会被转发到下载请求；其余 query 参数原样保留
        type:
          type: integer
          deprecated: true
          description: 历史字段（1=模型, 2=测试数据, 3=训练数据）。服务端完全忽略：不解析、不校验、不参与任何分支；请求携带什么资源由接口本身决定。保留定义仅为兼容仍携带该字段的旧平台
        taskId:
          type: string
          description: 任务唯一标识（与 requestId 不能同时为空）；同一 taskId 不能重复导入
        requestId:
          type: string
          description: 请求唯一标识（与 taskId 不能同时为空）；同一 requestId 不能重复导入
        publicKey:
          type: string
          description: 结构上接受，但本接口不使用：资源解封使用 TAA 自身的 SM2 私钥；结果导出用的平台公钥由 /v1/taa/importModel（phase 1）保存
        runtimeConfig:
          type: string
          description: 运行配置 JSON 字符串，非空时覆盖已保存的配置并落盘

    ImportModelRequest:
      type: object
      properties:
        resourceUrl:
          type: string
          description: 模型代码包的 HTTP(S) 下载地址。若之前未传输过且请求中为空则报错；若之前已传输保存过，则允许为空。为空时仅保存 runtimeConfig 并复用已保存的模型，不触发训练，等待后续数据下发（/v1/taa/import）时执行训练。密态资源可携带 ?dataKeyCipher=<hex> 参数承载 SM2 数据密钥信封（C1C3C2 布局，112 或 113 字节），该参数不会被转发到下载请求；其余 query 参数原样保留
        taskId:
          type: string
          description: 任务唯一标识（与 requestId 不能同时为空）
        requestId:
          type: string
          description: 请求唯一标识（与 taskId 不能同时为空）
        publicKey:
          type: string
          description: >-
            SM2 公钥 PEM，非必填。TAA 在 phase=1 且本字段非空时保存，作为 phase=3 结果加密导出的首选公钥；
            为空时不校验、不保存、也不返回失败，phase=3 导出会回退到导出请求携带的 publicKey，仍为空则明文导出
        runtimeConfig:
          type: string
          description: 模型运行配置 JSON 字符串（包含 commands 和 env）。resourceUrl 为空时必填且 commands 不能为空。
          example: '{"commands":["python3 train.py --input <in> --output <out>"]}'

    GetResourceInfoRequest:
      type: object
      required:
        - resourceUrl
      properties:
        resourceUrl:
          type: string
          description: 待预分析的资源 URL。本接口不解析 resourceUrl 中的 dataKeyCipher 参数（该参数仅供 /v1/taa/import 与 /v1/taa/importModel 使用）

    ResourceInfoResult:
      type: object
      properties:
        name:
          type: string
          description: 资源原始文件名
        size:
          type: integer
          description: 资源字节大小
        fileCount:
          type: integer
          description: 解包后文件总数
        fileTree:
          $ref: '#/components/schemas/FileTreeNode'

    # ── 目录树节点 ──────────────────────────────────────────────────────────
    FileTreeNode:
      type: object
      description: >-
        多模态目录树节点。表格类文件额外带 preview：最多 5 行的样本数据，每行是一个数组，
        按位置对齐同级的 fields（行内不带列名）。预览只在本接口返回，训练报告里的
        result_files 不含预览。
      properties:
        name:
          type: string
        type:
          type: string
          enum: [dir, file]
        fmt:
          type: string
          description: 魔数探测出的格式标签（csv/json/jsonl/xlsx/sqlite/parquet/txt/zip/...）
        size:
          type: integer
        rows:
          type: integer
          description: 结构化文件的数据行数（不含表头）
        isObject:
          type: boolean
          description: 单值 JSON 是否为对象
        fields:
          type: array
          description: 列定义，顺序与源文件一致；preview 的行按位置与之对齐
          items:
            $ref: '#/components/schemas/FileTreeField'
        tables:
          type: array
          description: SQLite 表级明细
          items:
            type: object
            properties:
              name:
                type: string
              rows:
                type: integer
              columns:
                type: array
                description: 列定义，preview 的行按位置与之对齐
                items:
                  $ref: '#/components/schemas/FileTreeField'
              preview:
                $ref: '#/components/schemas/FileTreePreview'
        preview:
          $ref: '#/components/schemas/FileTreePreview'
        warning:
          type: string
        file_count:
          type: integer
        children:
          type: array
          description: 子节点，结构与本节点完全一致
          items:
            $ref: '#/components/schemas/FileTreeNode'

    FileTreeField:
      type: object
      description: 列定义
      properties:
        name:
          type: string
        type:
          type: string
          description: 归一后的类型词汇表（int/float/str/bool/date/datetime/...）

    FileTreePreview:
      type: array
      description: >-
        表格类文件（csv/json 数组/jsonl/xlsx/sqlite）的前 5 行样本数据，按位置对齐 fields。
        短行补空串、超出列数丢弃、单元格超过 128 字符截断并以省略号结尾。
        parquet 只读元数据，没有预览；单值 JSON 对象不是表格，也没有预览。
      items:
        type: array
        items: {}

    # ── 阶段切换与导出 ──────────────────────────────────────────────────────
    SwitchRequest:
      type: object
      required:
        - phase
      properties:
        phase:
          type: integer
          enum: [1, 2, 3, 4]
          description: 目标计算阶段 (1=调试, 2=测试, 3=正式训练, 4=推理)

    ExportRequest:
      type: object
      properties:
        taskId:
          type: string
          description: 任务 ID
        publicKey:
          type: string
          description: >-
            结果接收方的国密 SM2 公钥 PEM，非必填。phase 1/2：非空时用于信封加密，为空则明文导出；
            phase 3：优先使用 phase 1 /v1/taa/importModel 保存的公钥，未保存时使用本字段，两者都为空则明文导出

    # ── 回调请求模型 ────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required:
        - dockerId
        - attestation
        - taaPublicKey
        - attestationValues
        - timestamp
        - verifiedPass
      properties:
        dockerId:
          type: string
          description: 容器/环境唯一标识
        attestation:
          type: string
          description: Base64 编码的 CSV 证明报告
        taaPublicKey:
          type: string
          description: TAA 实例专属 SM2 公钥 PEM
        attestationValues:
          type: string
          description: 报告提取核心字段 JSON
        timestamp:
          type: string
          description: Unix 时间戳（秒）
        verifiedPass:
          type: boolean
          description: 本地验证是否通过
        authInfo:
          type: object
          nullable: true
          description: 授权元数据（预留，当前固定 null）

    ReportResRequest:
      type: object
      required:
        - dockerId
        - requestId
        - code
      properties:
        dockerId:
          type: string
        requestId:
          type: string
        taskId:
          type: string
        code:
          type: integer
          description: 执行状态码 (0=成功, 非0=异常)
        msg:
          type: string
          nullable: true
          description: 错误或警告信息
        report:
          type: string
          description: 详细执行指标与报告 JSON

    ReportModelImportRequest:
      type: object
      required:
        - dockerId
        - requestId
        - code
      properties:
        dockerId:
          type: string
        requestId:
          type: string
        taskId:
          type: string
        code:
          type: integer
          description: 0=模型导入成功, 1=资源下载/解密/解压失败
        msg:
          type: string
          nullable: true
          description: 成功时固定为 "模型导入成功"，失败时为失败原因
        checksum:
          type: object
          description: 模型压缩包完整性校验（与 reportRes.training_task.model_checksum 格式一致）
          properties:
            size:
              type: integer
            algorithm:
              type: string
            value:
              type: string

    ReportAuditRequest:
      type: object
      required:
        - dockerId
        - requestId
        - code
      properties:
        dockerId:
          type: string
        requestId:
          type: string
        taskId:
          type: string
        code:
          type: integer
          description: >-
            `0`=代码审计通过, `1`=代码审计未通过（发现恶意/高危违规代码）,
            `2`=未得出结论（LLM 服务不可用，或审计进程异常中断，含 TAA 崩溃重启后由启动期补报）。
            审计结论仅供参考：无论取值如何，模型均保持已导入状态，TAA 不因此回滚或拒绝该模型。
        msg:
          type: string
          nullable: true
          description: 审计结论摘要或异常说明
        report:
          type: string
          description: 代码审计报告 JSON 字符串（格式与 AuditReport 一致）

    ModelLogRequest:
      type: object
      required:
        - dockerId
        - requestId
        - seqStart
        - entries
      properties:
        dockerId:
          type: string
          description: 容器唯一标识
        requestId:
          type: string
          description: 请求标识
        taskId:
          type: string
          description: 任务唯一标识（可选）
        seqStart:
          type: integer
          format: int64
          description: 本批日志起始序号
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ModelLogEntry'

    ModelLogEntry:
      type: object
      required:
        - seq
        - message
      properties:
        seq:
          type: integer
          format: int64
          description: 递增日志序号
        message:
          type: string
          description: 日志正文内容

    TaaLogRequest:
      type: object
      required:
        - dockerId
        - requestId
        - seqStart
        - entries
      properties:
        dockerId:
          type: string
          description: 容器唯一标识
        requestId:
          type: string
          description: 请求标识
        taskId:
          type: string
          description: 任务唯一标识（可选）
        seqStart:
          type: integer
          format: int64
          description: 本批日志起始序号
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TaaLogEntry'

    TaaLogEntry:
      type: object
      required:
        - seq
        - message
      properties:
        seq:
          type: integer
          format: int64
          description: 递增日志序号
        message:
          type: string
          description: 格式化的运行日志内容（例如 "[2026-09-18 18:00:00] [INFO] [controller] message"）

    ReportProgressRequest:
      type: object
      required:
        - dockerId
        - requestId
        - percent
        - timestamp
      properties:
        dockerId:
          type: string
          description: 容器唯一标识
        requestId:
          type: string
          description: 请求标识
        taskId:
          type: string
          description: 任务唯一标识（可选）
        percent:
          type: number
          format: double
          description: 当前任务进度百分比 (0.0 ~ 100.0)
        timestamp:
          type: string
          format: date-time
          description: 进度快照生成时间

    # ── 代码审计模型 ────────────────────────────────────────────────────────
    AuditReport:
      type: object
      properties:
        conclusion:
          type: object
          properties:
            passed:
              type: boolean
              description: 综合是否通过审计
            risk_level:
              type: string
              enum: [NONE, LOW, MEDIUM, HIGH, CRITICAL]
            summary:
              type: string
            recommendation:
              type: string
            statistics:
              type: object
              description: 最终大模型给���的 findings 归类统计
              properties:
                high:
                  type: integer
                  description: 大模型归类为高危的 findings 数量
                medium:
                  type: integer
                  description: 大模型归类为中危的 findings 数量
                low:
                  type: integer
                  description: 大模型归类为低危/良性的 findings 数量
        file_reports:
          type: array
          nullable: true
          items:
            type: object
            properties:
              filename:
                type: string
              findings:
                type: array
                items:
                  type: object
                  properties:
                    rule_id:
                      type: string
                    line:
                      type: integer
                    severity:
                      type: string
                    description:
                      type: string
                    llm_verdict:
                      type: string
                      enum: [BENIGN, SUSPICIOUS, MALICIOUS, UNCERTAIN]
                    confidence:
                      type: number
                    reasoning:
                      type: string
