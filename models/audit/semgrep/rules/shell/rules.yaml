# Semgrep rules for Shell/Bash script security audit
# Rule families align with TAA canonical 13-rule specification
rules:
  - id: taa-per-backdoor-shell
    languages: [bash, sh]
    severity: ERROR
    message: "Crontab or profile persistence modification detected in Shell script"
    metadata:
      category: persistence
      rule_family: PER_001
    pattern-either:
      - pattern: crontab ...
      - pattern: echo ... >> /etc/crontab
      - pattern: echo ... >> ~/.bashrc
      - pattern: echo ... >> ~/.profile

  - id: taa-cmd-exec-shell
    languages: [bash, sh]
    severity: ERROR
    message: "Dynamic shell script execution detected"
    metadata:
      category: execution
      rule_family: CMD_001
    pattern-either:
      - pattern: eval ...
      - pattern: bash -c ...
      - pattern: sh -c ...
      - pattern: curl ... | bash
      - pattern: curl ... | sh
      - pattern: wget ... | bash
      - pattern: wget ... | sh

  - id: taa-net-general-shell
    languages: [bash, sh]
    severity: ERROR
    message: "Outbound network download tool invocation in Shell script"
    metadata:
      category: network
      rule_family: NET_001
    pattern-either:
      - pattern: curl ...
      - pattern: wget ...
      - pattern: nc ...
